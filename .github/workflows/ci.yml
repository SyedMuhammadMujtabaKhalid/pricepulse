name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pricepulse
          POSTGRES_PASSWORD: pricepulse_secret
          POSTGRES_DB: pricepulse
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U $POSTGRES_USER"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: pricepulse
      POSTGRES_PASSWORD: pricepulse_secret
      POSTGRES_DB: pricepulse
      DATABASE_URL: postgresql://pricepulse:pricepulse_secret@localhost:5432/pricepulse

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Ensure entry‑point scripts (ruff, black) are on PATH
        export PATH=$HOME/.local/bin:$PATH
        pip install ruff black pytest-asyncio
    - name: Run Alembic migrations
      run: alembic upgrade head        
    - name: Lint with Ruff
      run: |
        python -m ruff check .
        
    - name: Format check with Black
      run: |
        python -m black --check .
        
    - name: Test with pytest
      run: |
        pytest tests/ --cov=src --cov-fail-under=70
